name: Suggest a repo
description: Saw a useful repo for Claude Code (in a reel, tweet, video)? Drop the link — it gets security-scanned and added automatically.
title: "Suggest: "
labels: [repo-suggestion]
body:
  - type: textarea
    id: links
    attributes:
      label: GitHub repo link(s)
      description: One or more github.com links or owner/repo names.
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where did you find it? (optional)
      placeholder: Instagram reel, YouTube, X...
